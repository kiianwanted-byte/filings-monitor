name: Diagnostics

# Run this by hand whenever something looks broken.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Congress connectivity
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python congress.py test
        continue-on-error: true
      - name: EDGAR feed probe
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python monitor.py feeds
        continue-on-error: true
      - name: Fear and Greed
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python monitor.py fng
        continue-on-error: true
      - name: Install OCR tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr poppler-utils
        continue-on-error: true
      - name: Trump 278-T connectivity
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python trump.py test
        continue-on-error: true
      - name: Earnings connectivity
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python earnings.py test
        continue-on-error: true
