name: Weekly Earnings Digest

on:
  schedule:
    # 23:00 UTC Sunday = 07:00 Monday Singapore
    - cron: "0 23 * * 0"
  workflow_dispatch:

concurrency:
  group: filings-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  earnings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Send weekly digest
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python earnings.py
      - name: Commit state
        continue-on-error: true
        run: |
          git config user.name "filings-monitor"
          git config user.email "actions@github.com"
          git add state data || true
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "earnings digest $(date -u '+%Y-%m-%d')" || exit 0
          # Another workflow may have pushed while this one ran. Retry with
          # backoff, and never fail the job over a state file: the next run
          # picks up where this one left off.
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin ${{ github.ref_name }} \
               && git push origin HEAD:${{ github.ref_name }}; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push attempt $i failed, retrying"
            sleep $((i * 5))
          done
          echo "::warning::could not push state this run, will retry next cycle"
          exit 0
