name: SEC Access Test

# Run it by hand from the Actions tab.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check SEC endpoints
        run: |
          UA="Kiian Tan kiianwanted@gmail.com"
          echo "=== SEC ACCESS TEST FROM GITHUB ACTIONS ==="
          echo "Runner IP: $(curl -s https://api.ipify.org)"
          echo ""

          check () {
            CODE=$(curl -s -o /tmp/body -w "%{http_code}" -A "$UA" "$2")
            SIZE=$(wc -c < /tmp/body)
            echo "$1 -> HTTP $CODE  (${SIZE} bytes)"
          }

          check "A cgi-bin atom  " "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=4&company=&dateb=&owner=include&count=10&output=atom"
          check "B Archives json " "https://www.sec.gov/Archives/edgar/data/320193/index.json"
          check "C data.sec.gov  " "https://data.sec.gov/submissions/CIK0000320193.json"
          check "D daily index   " "https://www.sec.gov/Archives/edgar/daily-index/index.json"
          check "E nasdaq halts  " "https://www.nasdaqtrader.com/rss.aspx?feed=tradehalts"

          echo ""
          echo "=== First 300 chars of the cgi-bin response ==="
          curl -s -A "$UA" "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=4&company=&dateb=&owner=include&count=10&output=atom" | head -c 300
          echo ""
          echo "=== END ==="
